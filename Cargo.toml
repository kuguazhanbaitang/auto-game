[package]
name = "auto-game"
version = "0.1.0"
edition = "2021"
description = "通用电脑游戏自动化测试框架"

[dependencies]
# 核心自动化库：截图 + 模板匹配找图 + 键鼠模拟（PyAutoGUI 的 Rust 版）
rustautogui = "2.5"
# 跨平台截图增强：多显示器、指定窗口捕获
xcap = "0.2"
# 跨平台键鼠模拟（trait 抽象，便于替换后端）
enigo = "0.2"
# 图像处理（截图缓冲、模板）
image = "0.25"
# 模板匹配（纯 Rust 实现）
imageproc = "0.25"
# 数据并行（模板匹配加速：候选精匹配并行）
rayon = "1"
# 配置序列化
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# 错误处理
anyhow = "1"
# 结构化日志
tracing = "0.1"
tracing-subscriber = "0.3"
log = "0.4"
device_query = "4.0.1"
# OCR 文字识别（可选能力）：PP-OCRv4 中文 ONNX 模型 + ONNX Runtime 推理
# 依赖本地 vendor（上游 0.2.7 在默认 feature 下引用 ort::ep::* 无法编译，已本地打补丁）
# 运行时依赖 libs/onnxruntime.dll，运行前设 ORT_DYLIB_PATH，见 README「OCR 文字识别」
paddleocr_rs_onnx = { path = "vendor/paddleocr_rs_onnx", version = "0.2.7" }
